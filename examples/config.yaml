# Example pipeline config (Cookbook Section 8.2 keys). Run after `gdpb simulate .` in this folder.
responses: raw_responses.csv
items: items.csv
# item_id: demo_service        # optional: estimate one item only
population: 260000000          # target population; hypothetical here
adoption_rate: null            # null = survey usage question; a number; or a CSV with item_id, adoption_rate
adoption_source: survey usage question
reporting_cap: 500             # cap for the mean, set separately from the offer grid
annualization_factor: 12
seed: 0
cleaning:
  min_duration_seconds: 45
  require_attention: true
estimation:
  link: logit
  n_boot: 500
output: deposit
