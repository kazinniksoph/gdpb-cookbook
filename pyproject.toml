[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdpb"
version = "0.1.0"
description = "Field, clean, estimate and aggregate GDP-B style willingness-to-accept choice experiments."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sophia Kazinnik" }]
keywords = ["GDP-B", "willingness to accept", "consumer surplus", "choice experiment", "free goods"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
gdpb = "gdpb.cli:main"

[project.urls]
Homepage = "https://github.com/kazinniksoph/gdpb-cookbook"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
